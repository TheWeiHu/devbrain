# Release on tag push: a preflight proves TAP_GITHUB_TOKEN can write the tap,
# THEN goreleaser publishes the GitHub release, then the formula is pushed with
# that same token (a fine-grained PAT with write on the SEPARATE
# homebrew-devbrain repo — the default GITHUB_TOKEN can't cross repos). The
# preflight runs first because the tap push is last: without it, an expired PAT
# fails only after the release is already public.
# Prerelease tags (v1.5.1-rc1) publish a prerelease and skip the tap push
# (brew-formula-push.sh guards), so an rc tag is a safe end-to-end dry run.
# The canary then proves a real `brew install` serves the new version.
# Manual fallback when Actions is down: `make release`.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release to republish to Homebrew (no asset rebuild)
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # goreleaser changelog needs the full tag history
          persist-credentials: false
      - name: Validate the release tag
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]
          git merge-base --is-ancestor "$RELEASE_TAG" origin/main
      - uses: actions/setup-go@v5
        if: github.event_name == 'push'
        with:
          go-version-file: go.mod
          cache: false # no go.sum (zero deps); silences the restore warning
      # Fail BEFORE goreleaser publishes anything. The tap push is the last step
      # of the job, so a bad TAP_GITHUB_TOKEN used to surface only after the
      # GitHub release and all four archives were already live — leaving a
      # published release whose formula still points at the previous version,
      # recoverable only by pushing the formula by hand (v1.5.22 hit exactly
      # this when the PAT expired). Checking write access up front turns that
      # half-published state into a clean no-op failure.
      # Skipped for prerelease tags, which never touch the tap.
      - name: Preflight — tap token can write the formula repo
        if: ${{ !contains(env.RELEASE_TAG, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: scripts/brew-formula-push.sh --check-auth
      - name: Download existing release checksums
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern checksums.txt --dir dist
      - uses: goreleaser/goreleaser-action@v6
        if: github.event_name == 'push'
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the brew formula to the tap
        env:
          GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: scripts/brew-formula-push.sh "${RELEASE_TAG#v}"

  brew-canary:
    # Real end-to-end check: a fresh mac can brew-install the version this tag
    # just released. Only for full releases — prereleases never touch the tap.
    needs: release
    if: ${{ !contains(inputs.release_tag || github.ref_name, '-') }}
    runs-on: macos-latest
    steps:
      - name: brew install from the tap and assert the version
        run: |
          brew install TheWeiHu/devbrain/devbrain
          got="$(devbrain version)"
          want="${RELEASE_TAG#v}"
          echo "brew served: $got · want: $want"
          case "$got" in *"$want"*) ;; *) exit 1 ;; esac
          devbrain doctor >/dev/null 2>&1 || true # runs; codex-only sandboxes may rc!=0
